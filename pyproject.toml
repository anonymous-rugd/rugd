[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftguard-traffic"
version = "0.1.0"
description = "Cross-city, rare-event and uncertainty-aware traffic congestion prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "pyarrow>=14,<22",
  "scikit-learn>=1.3,<2", "scipy>=1.10,<2", "torch>=2.1,<3",
  "pyyaml>=6,<7", "matplotlib>=3.7,<4", "seaborn>=0.13,<1",
  "tqdm>=4.66,<5", "joblib>=1.3,<2"
]

[project.optional-dependencies]
tuning = ["optuna>=3.5,<5", "lightgbm>=4,<5"]
demo = ["streamlit>=1.30,<2", "plotly>=5.18,<7"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
